name: Build Aventador Trade APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm deps
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Inject custom Java sources
        run: |
          D=android/app/src/main/java/com/aventador/trade
          mkdir -p $D
          cp android-src/MainActivity.java $D/
          cp android-src/FloatingBubbleService.java $D/

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=["INTERNET","SYSTEM_ALERT_WINDOW","FOREGROUND_SERVICE","FOREGROUND_SERVICE_SPECIAL_USE","POST_NOTIFICATIONS"]
          add=''
          for x in perms:
              if 'android.permission.'+x+'"' not in s:
                  add+='    <uses-permission android:name="android.permission.'+x+'"/>\n'
          s=s.replace('<application',add+'    <application',1)
          extra='''
              <service android:name=".FloatingBubbleService" android:exported="false"
                  android:foregroundServiceType="specialUse">
                  <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                      android:value="Trade automation overlay"/>
              </service>
          '''
          s=s.replace('</application>',extra+'</application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Sync web
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AventadorTrade-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
